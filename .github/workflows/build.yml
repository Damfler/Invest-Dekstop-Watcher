name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify version (version.py = source of truth)
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "from version import APP_VERSION; print(APP_VERSION)")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::version.py ($VERSION) != git tag ($TAG). Обновите version.py перед созданием тега."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller>=6.0

      - name: Generate version_info.txt
        run: python tools/gen_version_info.py

      - name: Build .exe
        run: python -m PyInstaller stack.spec --noconfirm --clean

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Stack v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Stack v${{ steps.version.outputs.VERSION }}

            ### Установка
            1. Скачайте `Stack.exe`
            2. Запустите — при первом запуске откроется мастер настройки
            3. Введите API-токен T-Invest

            Данные хранятся в `%APPDATA%\Stack\`
          files: dist/Stack.exe
          draft: false
          prerelease: false
