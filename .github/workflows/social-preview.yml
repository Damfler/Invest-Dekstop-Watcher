name: Social Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'version.py'
      - 'tools/gen_social_preview.py'
  release:
    types: [created, published]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        # Pillow — рендеринг; resvg-py — нативный SVG-рендерер для logo.svg.
        # Без resvg-py логотип Stack рисуется fallback-полигонами (некрасиво).
        run: pip install --quiet Pillow resvg-py

      - name: Download fonts (Inter + JetBrains Mono)
        # -f: упасть на HTTP-ошибке (раньше curl молча писал 404-страницу в .ttf
        #     и Pillow откатывался на load_default() — отсюда мелкий текст).
        # -S: показать ошибку  -L: следовать редиректам  -o: вывод в файл.
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          # Inter v4.1: в git остались только .woff2; статические .ttf — в release zip
          curl -fSL -o /tmp/Inter-4.1.zip "https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip"
          for f in Inter-Regular Inter-Medium Inter-Bold Inter-Black; do
            unzip -p /tmp/Inter-4.1.zip "extras/ttf/${f}.ttf" > "assets/fonts/${f}.ttf"
          done
          rm -f /tmp/Inter-4.1.zip
          # JetBrains Mono — фиксированный релиз v2.304
          JBM_BASE="https://github.com/JetBrains/JetBrainsMono/raw/v2.304/fonts/ttf"
          curl -fSL -o assets/fonts/JetBrainsMono-Regular.ttf "$JBM_BASE/JetBrainsMono-Regular.ttf"
          curl -fSL -o assets/fonts/JetBrainsMono-Bold.ttf    "$JBM_BASE/JetBrainsMono-Bold.ttf"
          # Sanity-check: настоящий TTF должен весить хотя бы 50 КБ.
          # Если меньше — это 404 HTML или редирект, заваливаем сборку явно.
          for f in assets/fonts/*.ttf; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 50000 ]; then
              echo "::error::$f is only $size bytes — download likely failed"
              head -c 200 "$f"
              exit 1
            fi
            printf "  %-50s %s bytes\n" "$f" "$size"
          done

      - name: Generate previews (default + all locales)
        run: |
          python tools/gen_social_preview.py
          python tools/gen_social_preview.py --all

      - name: Remove downloaded fonts (we don't commit them)
        run: rm -rf assets/fonts

      - name: Commit regenerated previews
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/github-social-preview*.png
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate social preview [skip ci]"
            git push
          fi

      - name: Attach previews to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/github-social-preview.png
            assets/github-social-preview-en.png
            assets/github-social-preview-ru.png

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-preview
          path: assets/github-social-preview*.png
          retention-days: 30
